# Property Triage — the four FastAPI microservices on one host (local or EC2).
#
# On EC2, AWS credentials come from the instance IAM role (boto3's default chain) —
# there are NO keys in this file. Resource IDs (KB / Guardrail) and the Gemini
# SECRET NAME are config, not secrets. The Gemini key itself stays in Secrets Manager.
#
# Run:  docker compose up --build -d      (from this directory)
name: property-triage

services:
  rag:
    build: { context: ./code, dockerfile: rag_service/Dockerfile }
    environment:
      AWS_REGION: us-east-1
      KB_ID: "3KTFERDLUV"
      GEMINI_SECRET_NAME: property-triage/gemini-api-key
      GEMINI_MODEL: gemini-2.5-flash
    ports: ["8001:8001"]
    restart: unless-stopped

  guardrails:
    build: { context: ./code, dockerfile: guardrails_service/Dockerfile }
    environment:
      AWS_REGION: us-east-1
      GUARDRAIL_ID: huksxm9z68f6
      GUARDRAIL_VERSION: DRAFT
      GEMINI_SECRET_NAME: property-triage/gemini-api-key
      GEMINI_MODEL: gemini-2.5-flash
    ports: ["8003:8003"]
    restart: unless-stopped

  image:
    build: { context: ./code, dockerfile: image_analyser/Dockerfile }
    # model.pth (git-ignored) is placed into code/image_analyser/ before build by
    # the EC2 bootstrap (pulled from S3); without it the service runs as a stub.
    ports: ["8002:8002"]
    restart: unless-stopped

  agent:
    build: { context: ./code, dockerfile: agent_service/Dockerfile }
    environment:
      AWS_REGION: us-east-1
      RAG_URL: http://rag:8001
      IMAGE_URL: http://image:8002
      GEMINI_SECRET_NAME: property-triage/gemini-api-key
      GEMINI_MODEL: gemini-2.5-flash
    ports: ["8000:8000"]
    depends_on: [rag, image]
    restart: unless-stopped

  # --- full-stack extras (for a hosted demo) -------------------------------- #
  n8n:
    image: n8nio/n8n:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach the sibling services via the host gateway (Linux/EC2)
    environment:
      N8N_SECURE_COOKIE: "false"          # allow login over plain http (public IP, no TLS)
      N8N_RUNNERS_ENABLED: "true"
    ports: ["5678:5678"]
    volumes: ["n8n_data:/home/node/.n8n"]
    restart: unless-stopped

  webui:
    build: { context: ./code/webui }
    environment:
      HOST: 0.0.0.0
      PORT: "5050"
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/listing   # reaches n8n by compose service name
      OLLAMA_URL: http://ollama:11434                    # Ollama runs in-cluster (CPU)
      IMAGE_URL: http://image:8002                       # WebUI analyses uploaded photos directly
      RAG_URL: http://rag:8001                           # chat grounds on the RAG/KB (seeds + submissions)
      UPLOAD_BUCKET: property-triage-listings-yrokach    # uploaded photos land under uploads/
      AWS_REGION: us-east-1
      KB_ID: "3KTFERDLUV"                                # accepted listings are ingested as RAG comparables
      KB_DATA_SOURCE_ID: NLORTTI7SG
      DDB_LISTINGS_TABLE: pt_listings                    # durable system-of-record (survives rebuilds)
      DDB_EVENTS_TABLE: pt_events                        # dashboard events — durable, no more resets
      DATA_DIR: /data                                    # local JSONL fallback when DDB tables are unset
    ports: ["5050:5050"]
    volumes: ["webui_data:/data"]
    depends_on: [n8n, ollama, image, rag]
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes: ["ollama_data:/root/.ollama"]
    ports: ["11434:11434"]
    restart: unless-stopped
    deploy:                       # hand the NVIDIA T4 to Ollama (g4dn) — needs nvidia-container-toolkit
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  n8n_data:
  ollama_data:
  webui_data:
